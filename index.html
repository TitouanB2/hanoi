<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Les Tours de Hanoï</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="jeu">
    <h1>Les Tours de Hanoï</h1>

    <div class="commandes">
      <label for="nb-anneaux">Nombre d’anneaux</label>
      <input id="nb-anneaux" name="nb-anneaux" type="number" min="1" max="8" value="3" required>
      <button id="btn-demarrer" type="button">Démarrer</button>
      <button id="btn-demo" type="button">Démo automatique</button>
      <button id="btn-reset" type="button">Reset</button>
      <button id="btn-theme" type="button" aria-label="Activer le mode sombre">Mode sombre</button>
    </div>

    <p id="statut-demo" class="statut-demo" aria-live="polite"></p>
    <p id="compteur-coups" class="compteur-coups" aria-live="polite">
      Coups : <span id="nb-coups">0</span>
    </p>
    <p id="message-victoire" class="message-victoire" aria-live="polite"></p>
    <p id="score" class="score" aria-live="polite"></p>

    <div id="plateau" class="plateau" aria-label="Plateau des Tours de Hanoï">
      <div class="tour" aria-label="Tour 1"></div>
      <div class="tour" aria-label="Tour 2"></div>
      <div class="tour" aria-label="Tour 3"></div>
    </div>
  </main>
</body>
</html>
